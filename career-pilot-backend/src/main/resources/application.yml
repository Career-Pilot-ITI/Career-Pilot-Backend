app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session:
    minutes-per-coin: ${MINUTES_PER_COIN:2}
  plans:
    coins:
      FREE: 20
      PLUS: 80
      PRO: 160
  embedding:
    sweep-on-startup: ${EMBED_SWEEP_ON_STARTUP:true}
  job-parse:
    coin-cost: ${JOB_PARSE_COIN_COST:1}
  ats-score:
    coin-cost: ${ATS_SCORE_COIN_COST:5}
  cv-optimize:
    coin-cost: ${CV_OPTIMIZE_COIN_COST:15}
    max-output-factor: ${CV_OPTIMIZE_MAX_OUTPUT_FACTOR:1.5}
    max-anchor-factor: ${CV_OPTIMIZE_MAX_ANCHOR_FACTOR:6}
    max-parallel-sections: ${CV_OPTIMIZE_MAX_PARALLEL_SECTIONS:2}
  cover-letter:
    coin-cost: ${COVER_LETTER_COIN_COST:5}
    plus-search-max-chars: ${COVER_LETTER_PLUS_SEARCH_MAX_CHARS:1500}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  redirect:
    uri:
      app: ${URI_APP:http://localhost:5173}
  otp:
    provider: ${OTP_PROVIDER:simulated}
  wireweb:
    api-key: ${WIREWEB_API_KEY:}
    session-id: ${WIREWEB_SESSION_ID:}
    base-url: ${WIREWEB_BASE_URL:https://app.wireweb.co.in}
  chocodata:
    api-key: ${CHOCODATA_API_KEY:}
    base-url: ${CHOCODATA_BASE_URL:https://api.chocodata.com/api/v1/linkedin/job}
   
management:
  health:
    mail:
      enabled: false

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: DEBUG
    com.careerpilot: INFO

