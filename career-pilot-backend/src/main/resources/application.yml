server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: America/Lima
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/career_pilot}
    username: ${DB_USERNAME:career_pilot}
    password: ${DB_PASSWORD:career_pilot}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      max-lifetime: 540000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  ai:
    chat:
      client:
        enabled: true
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3}
          temperature: ${LLM_TEMPERATURE:0.4}
    openai:
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${LLM_API_KEY:not-set}
      chat:
        options:
          model: ${LLM_MODEL:gemini-3.1-flash-lite}
          temperature: ${LLM_TEMPERATURE:0.4}
      embedding:
        enabled: true
        base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api}
        api-key: ${LLM_API_KEY:not-set}
        track-match-threshold: ${EMBED_TRACK_MATCH_THRESHOLD:0.45}
        question-match-threshold: ${EMBED_QUESTION_MATCH_THRESHOLD:0.45}
        options:
          model: ${EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2:free}
          dimensions: ${EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-validation: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

paymob:
  base-url: ${PAYMOB_BASE_URL:https://accept.paymob.com}
  secret-key: ${PAYMOB_SECRET_KEY:}
  public-key: ${PAYMOB_PUBLIC_KEY:}
  hmac-secret: ${PAYMOB_HMAC_SECRET:}
  notification-url: ${PAYMOB_NOTIFICATION_URL:}
  redirection-url: ${PAYMOB_REDIRECTION_URL:http://localhost:5173/payment/result}
  integration-ids:
    card: ${PAYMOB_INTEGRATION_ID_CARD:0}
coin-packs:
  prices:
    50: 149.0
    120: 299.0
    300: 599.0

tier-pricing:
  prices:
    PLUS: 349.0
    PRO: 599.0
security:
