name: Shared Server Docker Deployment - Team 1

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SSH/SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/home/student/team1/app"

      - name: Deploy Docker Compose via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/student/team1/app
            
            # Write out the env variables
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Restart the containers (using rootless environment variables if applicable)
            export PATH=/home/student/bin:$PATH
            export DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock
            
            docker compose down --remove-orphans
            docker compose up -d --build
